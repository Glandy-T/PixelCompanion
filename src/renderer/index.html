<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="pet-window" aria-label="Pixel Companion placeholder character">
      <p id="notice" class="notice" aria-live="polite"></p>
      <p id="speech-bubble" class="speech-bubble" role="status" hidden>
        Hello, Glandy.
      </p>
      <button id="pet-character" class="pet-character" type="button" aria-label="灰色像素占位角色">
      <img
        class="pixel-character"
        src="../../assets/characters/placeholder/placeholder-character.svg"
        alt="灰色像素占位角色"
        draggable="false"
      />
      </button>
      <section id="debug-panel" class="debug-panel" aria-label="Behavior engine debug panel" hidden>
        <strong>Behavior: <span id="behavior-readout">idle</span></strong>
        <div class="environment-readout" aria-label="Environment sensor debug data">
          <span>App: <b id="environment-app">unknown</b></span>
          <span>Category: <b id="environment-category">other</b></span>
          <span>Active: <b id="environment-duration">0s</b></span>
          <span>Idle: <b id="environment-idle">0s</b></span>
          <span>Switches: <b id="environment-switches">none</b></span>
        </div>
        <div class="debug-actions">
          <button type="button" data-behavior="idle">idle</button>
          <button type="button" data-behavior="thinking">thinking</button>
          <button type="button" data-behavior="working">working</button>
          <button type="button" data-behavior="waiting">waiting</button>
          <button type="button" data-behavior="success">success</button>
          <button type="button" data-behavior="alert">alert</button>
          <button type="button" data-behavior="sleepy">sleepy</button>
        </div>
      </section>
    </main>
    <script src="renderer.js"></script>
  </body>
</html>
