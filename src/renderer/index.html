<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="pet-window" aria-label="Pixel Companion placeholder character">
      <p id="notice" class="notice" aria-live="polite"></p>
      <p id="speech-bubble" class="speech-bubble" role="status" hidden>
        Hello, Glandy.
      </p>
      <button id="pet-character" class="pet-character" type="button" aria-label="灰色像素占位角色">
        <span id="pet-motion" class="pet-motion">
          <img
            id="character-image"
            class="pixel-character"
            src="../../assets/characters/placeholder/placeholder-character.svg"
            alt="灰色像素占位角色"
            draggable="false"
          />
        </span>
      </button>
      <span id="state-indicator" class="state-indicator" aria-hidden="true" hidden></span>
    </main>
    <script src="../animation/animation-registry.js"></script>
    <script src="../animation/animation-controller.js"></script>
    <script src="../animation/animation-player.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
